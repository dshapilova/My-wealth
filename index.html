<html>
<meta name="viewport" content="width=device-width">

<style>
body{font-family:Arial;background:#faf9f7;color:#17304f;margin:25px}
div{padding:15px;margin:8px 0;border-radius:16px;background:#e8f4ef}
button,input,select{width:100%;padding:14px;margin:6px 0;border:0;border-radius:12px;font-size:16px}
button{background:#17345e;color:white}
.f{display:none}
</style>

<h1>My Wealth</h1>

<div>💵 Kaspi <h2 id=b></h2></div>

<button onclick="h.style.display='none';f.style.display='block'">
+ Добавить операцию
</button>

<section id=h></section>

<section id=f class=f>
<h2>Новая операция</h2>

<select id=t>
<option>Расход</option>
<option>Доход</option>
</select>

<input id=a type=number placeholder="Сумма ₸">

<select>
<option>Продукты</option>
<option>Транспорт</option>
<option>Дом</option>
</select>

<button onclick="save()">Сохранить</button>

<button onclick="f.style.display='none'">
← Назад
</button>
</section>

<script>
let x=+localStorage.k||1000000;
b.innerText=x.toLocaleString()+' ₸';

function save(){
let n=+a.value;
if(n<=0)return alert('Введите сумму');
x=t.value=='Расход'?x-n:x+n;
localStorage.k=x;
b.innerText=x.toLocaleString()+' ₸';
f.style.display='none';
alert('Операция сохранена ✓')
}
</script>
</html>
